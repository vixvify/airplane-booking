<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1120" role="img" aria-labelledby="title description">
  <title id="title">Airplane reservation system architecture</title>
  <desc id="description">One Docker container runs a server process plus five or more client processes launched through docker exec. Client processes communicate with server worker threads through separate System V request and response queues. Workers share 20 in-memory seats and per-seat C++ mutexes in sync mode.</desc>
  <defs>
    <marker id="request-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74b7ff"/></marker>
    <marker id="response-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62ddbd"/></marker>
    <marker id="control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a9b9d1"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #f0f5ff; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #bdcbe0; }
      .group { font-size: 21px; font-weight: 700; fill: #b9cbe2; letter-spacing: 1px; }
      .name { font-size: 23px; font-weight: 700; }
      .detail { font-size: 19px; fill: #c5d2e5; }
      .small { font-size: 17px; fill: #adc0d9; }
      .flow { font-size: 17px; font-weight: 700; }
      .request-label { fill: #91c9ff; }
      .response-label { fill: #83ead0; }
      .request { fill: none; stroke: #74b7ff; stroke-width: 4; stroke-linejoin: round; marker-end: url(#request-arrow); }
      .response { fill: none; stroke: #62ddbd; stroke-width: 4; stroke-linejoin: round; marker-end: url(#response-arrow); }
      .control { fill: none; stroke: #a9b9d1; stroke-width: 3; stroke-linejoin: round; marker-end: url(#control-arrow); }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#0c1422"/>
  <text x="80" y="58" class="title">Airplane Reservation — architecture</text>
  <text x="80" y="88" class="subtitle">One Docker container · two System V message queues · server + client processes in one IPC namespace</text>

  <rect x="80" y="120" width="1640" height="130" rx="18" fill="#18263a" stroke="#506581" stroke-width="2"/>
  <text x="110" y="155" class="group">HOST · COMMANDS AND EVIDENCE</text>
  <rect x="115" y="175" width="445" height="55" rx="9" fill="#284565" stroke="#81b7f4" stroke-width="2"/>
  <text x="338" y="209" text-anchor="middle" class="name">Demo / test / load-test scripts</text>
  <path d="M 560 202 H 655" class="control"/>
  <rect x="655" y="175" width="370" height="55" rx="9" fill="#284565" stroke="#81b7f4" stroke-width="2"/>
  <text x="840" y="209" text-anchor="middle" class="name">Docker build / run / exec</text>
  <path d="M 1025 202 H 1120" class="control"/>
  <rect x="1120" y="175" width="565" height="55" rx="9" fill="#284565" stroke="#81b7f4" stroke-width="2"/>
  <text x="1402" y="209" text-anchor="middle" class="name">TXT results + server logs on host</text>

  <rect x="80" y="285" width="1640" height="575" rx="18" fill="#172235" stroke="#506581" stroke-width="2"/>
  <text x="110" y="321" class="group">ONE DOCKER CONTAINER · ALL PROCESSES SHARE THE SAME IPC NAMESPACE</text>
  <path d="M 840 230 V 285" class="control"/>

  <rect x="110" y="355" width="305" height="450" rx="16" fill="#193428" stroke="#69c392" stroke-width="2"/>
  <text x="135" y="387" class="group">CLIENT PROCESSES</text>
  <g fill="#254b39" stroke="#77d4a4" stroke-width="2">
    <rect x="135" y="410" width="255" height="52" rx="8"/>
    <rect x="135" y="470" width="255" height="52" rx="8"/>
    <rect x="135" y="530" width="255" height="52" rx="8"/>
    <rect x="135" y="590" width="255" height="52" rx="8"/>
    <rect x="135" y="650" width="255" height="52" rx="8"/>
  </g>
  <text x="262" y="444" text-anchor="middle" class="name">Client 1</text>
  <text x="262" y="504" text-anchor="middle" class="name">Client 2</text>
  <text x="262" y="564" text-anchor="middle" class="name">Client 3</text>
  <text x="262" y="624" text-anchor="middle" class="name">Client 4</text>
  <text x="262" y="684" text-anchor="middle" class="name">Client 5</text>
  <text x="135" y="743" class="detail">./client or ./load_test via exec</text>
  <text x="135" y="773" class="small">5 shown; more via docker exec</text>

  <rect x="525" y="385" width="265" height="130" rx="13" fill="#48341e" stroke="#e8ad56" stroke-width="2"/>
  <text x="657" y="425" text-anchor="middle" class="name">Request queue</text>
  <text x="657" y="456" text-anchor="middle" class="detail">System V · mtype = 1</text>
  <text x="657" y="485" text-anchor="middle" class="small">ftok(/ipc, 'A')</text>

  <rect x="525" y="640" width="265" height="130" rx="13" fill="#174038" stroke="#65ddbf" stroke-width="2"/>
  <text x="657" y="680" text-anchor="middle" class="name">Response queue</text>
  <text x="657" y="711" text-anchor="middle" class="detail">mtype = requestId</text>
  <text x="657" y="740" text-anchor="middle" class="small">ftok(/ipc, 'B')</text>

  <rect x="925" y="355" width="760" height="450" rx="16" fill="#2a233c" stroke="#ad92df" stroke-width="2"/>
  <text x="950" y="387" class="group">SERVER PROCESS · SAME CONTAINER</text>
  <rect x="955" y="410" width="700" height="76" rx="10" fill="#3b3051" stroke="#bea6e8" stroke-width="2"/>
  <text x="1305" y="440" text-anchor="middle" class="name">Server process</text>
  <text x="1305" y="467" text-anchor="middle" class="detail">Creates queues · starts threads · owns seat state · flock singleton</text>
  <path d="M 1305 486 V 514" class="control"/>

  <rect x="955" y="515" width="700" height="125" rx="10" fill="#372b4c" stroke="#bea6e8" stroke-width="2"/>
  <text x="980" y="541" class="detail">One worker per request · LIST / STATUS / RESERVE / CANCEL / QUIT</text>
  <g fill="#504069" stroke="#c9b2f0" stroke-width="2">
    <rect x="975" y="560" width="205" height="57" rx="8"/>
    <rect x="1202" y="560" width="205" height="57" rx="8"/>
    <rect x="1429" y="560" width="205" height="57" rx="8"/>
  </g>
  <text x="1078" y="596" text-anchor="middle" class="name">Worker 1</text>
  <text x="1305" y="596" text-anchor="middle" class="name">Worker 2</text>
  <text x="1532" y="596" text-anchor="middle" class="name">Worker 3</text>

  <path d="M 1120 640 V 671" class="control"/>
  <rect x="955" y="672" width="325" height="104" rx="10" fill="#214548" stroke="#65c6c9" stroke-width="2"/>
  <text x="1117" y="709" text-anchor="middle" class="name">20 seats in memory</text>
  <text x="1117" y="740" text-anchor="middle" class="detail">0 = free · clientId = owner</text>
  <rect x="1320" y="672" width="335" height="104" rx="10" fill="#354129" stroke="#b0ce75" stroke-width="2"/>
  <text x="1487" y="709" text-anchor="middle" class="name">20 std::mutex locks</text>
  <text x="1487" y="740" text-anchor="middle" class="detail">Per-seat · used in sync mode</text>
  <path d="M 1320 724 H 1280" class="control"/>

  <path d="M 415 449 H 525" class="request"/>
  <text x="470" y="432" text-anchor="middle" class="flow request-label">send</text>
  <path d="M 790 450 H 850 V 575 H 955" class="request"/>
  <text x="809" y="432" class="flow request-label">receive</text>
  <path d="M 955 611 H 855 V 705 H 790" class="response"/>
  <text x="835" y="682" class="flow response-label">reply</text>
  <path d="M 525 705 H 415" class="response"/>
  <text x="470" y="690" text-anchor="middle" class="flow response-label">match ID</text>

  <rect x="80" y="895" width="510" height="160" rx="14" fill="#20334b" stroke="#719ad0" stroke-width="2"/>
  <text x="107" y="930" class="group">MESSAGE CONTRACT</text>
  <text x="107" y="964" class="detail">clientId + requestId + command (127 B max)</text>
  <text x="107" y="994" class="detail">Response carries matching IDs + result text</text>
  <text x="107" y="1024" class="small">ftok derives keys from /ipc; queues stay in kernel</text>

  <rect x="645" y="895" width="510" height="160" rx="14" fill="#20334b" stroke="#719ad0" stroke-width="2"/>
  <text x="672" y="930" class="group">SEAT TRANSACTION</text>
  <text x="672" y="964" class="detail">Validate all seats → check → update</text>
  <text x="672" y="994" class="detail">Sync: all-or-nothing with ordered locks</text>
  <text x="672" y="1024" class="small">Nosync: intentional race + 50–500 ms delay</text>

  <rect x="1210" y="895" width="510" height="160" rx="14" fill="#20334b" stroke="#719ad0" stroke-width="2"/>
  <text x="1237" y="930" class="group">EXPERIMENTS + OBSERVABILITY</text>
  <text x="1237" y="964" class="detail">1: sync / 1 worker · 2: nosync / 3 workers</text>
  <text x="1237" y="994" class="detail">3: sync / 3 workers · logs tagged SEQ</text>
  <text x="1237" y="1024" class="small">Demo and load-test evidence saved under results/</text>

  <text x="80" y="1092" class="small">Blue arrows: requests     Green arrows: responses     Gray arrows: lifecycle / state access</text>
</svg>

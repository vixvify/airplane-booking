<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 800" role="img" aria-labelledby="title description">
  <title id="title">Airplane reservation system architecture</title>
  <desc id="description">Five client containers send requests to a shared System V request queue. Server worker threads receive requests, update shared seat state, and send results to a separate response queue. Clients read responses matched by request ID.</desc>
  <defs>
    <marker id="request-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#73b4ff"/></marker>
    <marker id="response-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61d7bb"/></marker>
    <marker id="control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a9b8d0"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #f0f4ff; }
      .heading { font-size: 28px; font-weight: 700; }
      .group-label { font-size: 21px; font-weight: 700; fill: #bdcbe1; }
      .card-title { font-size: 22px; font-weight: 700; }
      .card-note { font-size: 18px; fill: #b8c7de; }
      .flow-label { font-size: 18px; font-weight: 700; }
      .request-label { fill: #8bc3ff; }
      .response-label { fill: #7ce4ca; }
      .request { fill: none; stroke: #73b4ff; stroke-width: 4; stroke-linejoin: round; marker-end: url(#request-arrow); }
      .response { fill: none; stroke: #61d7bb; stroke-width: 4; stroke-linejoin: round; marker-end: url(#response-arrow); }
      .control { fill: none; stroke: #a9b8d0; stroke-width: 3; stroke-linejoin: round; marker-end: url(#control-arrow); }
    </style>
  </defs>

  <rect width="1540" height="800" fill="#0d1422"/>
  <text x="75" y="57" class="heading">Airplane Reservation — system overview</text>

  <rect x="65" y="90" width="1410" height="145" rx="18" fill="#172235" stroke="#4a5b75" stroke-width="2"/>
  <text x="95" y="125" class="group-label">HOST · RUNNING THE DEMOS</text>
  <rect x="100" y="145" width="405" height="65" rx="10" fill="#243b59" stroke="#78a8e9" stroke-width="2"/>
  <text x="302" y="185" text-anchor="middle" class="card-title">Demo / test / load-test scripts</text>
  <rect x="630" y="145" width="300" height="65" rx="10" fill="#243b59" stroke="#78a8e9" stroke-width="2"/>
  <text x="780" y="185" text-anchor="middle" class="card-title">Docker Compose</text>
  <path d="M 505 177 H 630" class="control"/>

  <rect x="65" y="275" width="1410" height="455" rx="18" fill="#172235" stroke="#4a5b75" stroke-width="2"/>
  <text x="95" y="310" class="group-label">DOCKER COMPOSE PROJECT · SHARED IPC NAMESPACE</text>
  <path d="M 780 210 V 275" class="control"/>
  <text x="798" y="257" class="card-note">starts services / runs commands</text>

  <rect x="100" y="340" width="275" height="350" rx="16" fill="#163127" stroke="#5eae83" stroke-width="2"/>
  <text x="125" y="373" class="group-label">CLIENT CONTAINERS</text>
  <g fill="#214535" stroke="#6bc394" stroke-width="2">
    <rect x="125" y="390" width="225" height="48" rx="8"/>
    <rect x="125" y="448" width="225" height="48" rx="8"/>
    <rect x="125" y="506" width="225" height="48" rx="8"/>
    <rect x="125" y="564" width="225" height="48" rx="8"/>
    <rect x="125" y="622" width="225" height="48" rx="8"/>
  </g>
  <text x="238" y="421" text-anchor="middle" class="card-title">Client 1</text>
  <text x="238" y="479" text-anchor="middle" class="card-title">Client 2</text>
  <text x="238" y="537" text-anchor="middle" class="card-title">Client 3</text>
  <text x="238" y="595" text-anchor="middle" class="card-title">Client 4</text>
  <text x="238" y="653" text-anchor="middle" class="card-title">Client 5</text>

  <rect x="495" y="365" width="245" height="100" rx="12" fill="#42301b" stroke="#e7aa4b" stroke-width="2"/>
  <text x="618" y="402" text-anchor="middle" class="card-title">Request queue</text>
  <text x="618" y="435" text-anchor="middle" class="card-note">System V · mtype = 1</text>

  <rect x="495" y="545" width="245" height="100" rx="12" fill="#163c36" stroke="#62d4b6" stroke-width="2"/>
  <text x="618" y="582" text-anchor="middle" class="card-title">Response queue</text>
  <text x="618" y="615" text-anchor="middle" class="card-note">mtype = requestId</text>

  <rect x="860" y="340" width="570" height="350" rx="16" fill="#2a223d" stroke="#aa8bda" stroke-width="2"/>
  <text x="885" y="373" class="group-label">SERVER CONTAINER</text>
  <rect x="900" y="390" width="490" height="65" rx="10" fill="#392c50" stroke="#b59ae2" stroke-width="2"/>
  <text x="1145" y="418" text-anchor="middle" class="card-title">Server process</text>
  <text x="1145" y="442" text-anchor="middle" class="card-note">creates queues and starts workers</text>

  <rect x="900" y="495" width="490" height="125" rx="10" fill="#332846" stroke="#b59ae2" stroke-width="2"/>
  <text x="925" y="525" class="card-note">Worker threads · one receives each request</text>
  <g fill="#493761" stroke="#c0a6eb" stroke-width="2">
    <rect x="920" y="545" width="140" height="55" rx="8"/>
    <rect x="1075" y="545" width="140" height="55" rx="8"/>
    <rect x="1230" y="545" width="140" height="55" rx="8"/>
  </g>
  <text x="990" y="580" text-anchor="middle" class="card-title">Worker 1</text>
  <text x="1145" y="580" text-anchor="middle" class="card-title">Worker 2</text>
  <text x="1300" y="580" text-anchor="middle" class="card-title">Worker 3</text>

  <rect x="900" y="650" width="490" height="50" rx="10" fill="#392c50" stroke="#b59ae2" stroke-width="2"/>
  <text x="1145" y="682" text-anchor="middle" class="card-title">20 seats in server memory</text>

  <path d="M 375 415 H 495" class="request"/>
  <text x="435" y="400" text-anchor="middle" class="flow-label request-label">request</text>
  <path d="M 740 415 H 790 V 535 H 900" class="request"/>
  <text x="809" y="402" class="flow-label request-label">receive</text>
  <path d="M 1145 455 V 495" class="control"/>

  <path d="M 900 605 H 740" class="response"/>
  <text x="820" y="591" text-anchor="middle" class="flow-label response-label">send result</text>
  <path d="M 495 595 H 375" class="response"/>
  <text x="435" y="576" text-anchor="middle" class="flow-label response-label">reply</text>
  <path d="M 1145 620 V 650" class="control"/>

  <text x="80" y="768" class="card-note">Blue = request flow     Green = response flow     Gray = runtime / control</text>
</svg>

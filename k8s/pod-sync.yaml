apiVersion: v1
kind: Pod

metadata:
  name: airplane-reservation

spec:
  containers:
    - name: server
      image: airplane-reservation:latest
      imagePullPolicy: Never
      command:
        - "./server"
        - "sync"
        - "3"
      volumeMounts:
        - name: ipc-shared
          mountPath: /ipc

    - name: client-1
      image: airplane-reservation:latest
      imagePullPolicy: Never
      command:
        - "sleep"
        - "infinity"
      volumeMounts:
        - name: ipc-shared
          mountPath: /ipc

    - name: client-2
      image: airplane-reservation:latest
      imagePullPolicy: Never
      command:
        - "sleep"
        - "infinity"
      volumeMounts:
        - name: ipc-shared
          mountPath: /ipc

    - name: client-3
      image: airplane-reservation:latest
      imagePullPolicy: Never
      command:
        - "sleep"
        - "infinity"
      volumeMounts:
        - name: ipc-shared
          mountPath: /ipc

    - name: client-4
      image: airplane-reservation:latest
      imagePullPolicy: Never
      command:
        - "sleep"
        - "infinity"
      volumeMounts:
        - name: ipc-shared
          mountPath: /ipc

    - name: client-5
      image: airplane-reservation:latest
      imagePullPolicy: Never
      command:
        - "sleep"
        - "infinity"
      volumeMounts:
        - name: ipc-shared
          mountPath: /ipc

  volumes:
    - name: ipc-shared
      emptyDir: {}

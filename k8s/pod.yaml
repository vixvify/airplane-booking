apiVersion: v1
kind: Pod

metadata:
  name: airplane-reservation

spec:
  hostIPC: true

  containers:
    - name: server
      image: airplane-reservation:latest
      imagePullPolicy: Never
      command:
        - "./server"
        - "nosync"
        - "3"

    - name: client-1
      image: airplane-reservation:latest
      imagePullPolicy: Never
      command:
        - "sleep"
        - "infinity"

    - name: client-2
      image: airplane-reservation:latest
      imagePullPolicy: Never
      command:
        - "sleep"
        - "infinity"

    - name: client-3
      image: airplane-reservation:latest
      imagePullPolicy: Never
      command:
        - "sleep"
        - "infinity"

    - name: client-4
      image: airplane-reservation:latest
      imagePullPolicy: Never
      command:
        - "sleep"
        - "infinity"

    - name: client-5
      image: airplane-reservation:latest
      imagePullPolicy: Never
      command:
        - "sleep"
        - "infinity"

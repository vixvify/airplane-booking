name: C++ CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make

      - name: Show compiler version
        run: |
          g++ --version
          make --version

      - name: Build
        run: make

      - name: Check binaries
        run: |
          test -f server
          test -f client
          test -f load_test

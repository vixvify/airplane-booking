name: C++ CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux image
        run: docker build -t airplane-reservation:ci .
      - name: Unit, integration, regression and script tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          docker run --name reservation-ci \
            -v "$PWD/results:/app/results" \
            airplane-reservation:ci timeout 300s bash scripts/test.sh
      - name: Save container output
        if: always()
        run: |
          mkdir -p results
          docker logs reservation-ci > results/container.txt 2>&1 || true
          docker rm -f reservation-ci >/dev/null 2>&1 || true
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reservation-test-results
          path: results/
          if-no-files-found: warn
          retention-days: 14
